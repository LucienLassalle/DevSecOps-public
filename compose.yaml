services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY dans le fichier .env}
      COOKIE_SECURE: "false"
    volumes:
      - delivery-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  delivery-data:
